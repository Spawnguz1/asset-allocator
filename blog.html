<!DOCTYPE html>
<html lang="it" id="html-root">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUREA — Blog</title>
<style>
  html, :root{
    --bg: #10141b; --panel: #161c26; --panel-2: #1c2330; --line: #2a3242;
    --ink: #e8e6df; --ink-dim: #9aa3b2; --ink-faint: #6c7686;
    --gold: #c9a24b; --gold-dim: #8a7238; --bond: #3f6f9e; --stock: #7bb3d9;
    --serif: 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
  }
  html[data-theme="light"]{
    --bg: #f7f5ee; --panel: #ffffff; --panel-2: #f0ede0; --line: #ddd5c0;
    --ink: #1d2436; --ink-dim: #57627c; --ink-faint: #848faa;
    --gold: #a4761f; --gold-dim: #8a6a2e; --bond: #2f5a86; --stock: #4f8fc0;
  }
  *{ box-sizing: border-box; }
  body{ margin:0; background: var(--bg); color: var(--ink); font-family: var(--sans); line-height:1.6; padding: 40px 20px 90px; }
  .wrap{ max-width: 780px; margin: 0 auto; }
  .topbar{ flex-wrap:wrap; gap:12px; display:flex; justify-content: space-between; align-items:center; margin-bottom: 22px; }
  .pagenav{ display:flex; gap:16px; flex-wrap:wrap; }
  .pagenav a{ color: var(--ink-dim); font-size:13px; text-decoration:none; padding-bottom:2px; border-bottom:1px solid transparent; white-space:nowrap; }
  .pagenav a:hover{ color: var(--ink); }
  .pagenav a.active{ color: var(--gold); border-color: var(--gold-dim); }
  .topbar-right{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .donate-btn{ font-size:12px; color:#231a06; background: var(--gold); padding:6px 12px; border-radius:3px; text-decoration:none; font-family: var(--sans); white-space:nowrap; }
  .donate-btn:hover{ background:#d9b45f; }
  .langtoggle, .themetoggle{ display:flex; gap: 6px; }
  .langtoggle button, .themetoggle button{ background: var(--panel-2); border: 1px solid var(--line); color: var(--ink-dim); font-size: 12px; padding: 5px 10px; border-radius: 3px; cursor:pointer; font-family: var(--sans); }
  .langtoggle button.active, .themetoggle button.active{ color: var(--gold); border-color: var(--gold-dim); }

  header{ margin-bottom: 30px; border-bottom: 1px solid var(--line); padding-bottom: 24px; }
  header .kicker{ font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; color: var(--gold-dim); margin-bottom: 10px; }
  header h1{ font-family: var(--serif); font-weight: 400; font-size: 28px; margin: 0 0 10px; }
  header p{ color: var(--ink-dim); margin:0; font-size: 14px; }

  article.post{ background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 22px 24px; margin-bottom: 20px; }
  article.post .date{ font-size: 12px; color: var(--gold-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; }
  article.post h2{ font-family: var(--serif); font-weight: 400; font-size: 20px; margin: 0 0 12px; color: var(--ink); }
  article.post .body p{ font-size: 14.5px; color: var(--ink); margin: 0 0 12px; }
  article.post .body p:last-child{ margin-bottom: 0; }

  .empty{ text-align:center; padding: 50px 20px; color: var(--ink-faint); font-size: 14px; border: 1px dashed var(--line); border-radius: 4px; }

  footer{ margin-top: 40px; padding-top: 20px; border-top: 1px solid var(--line); font-size: 12.5px; color: var(--ink-faint); }
</style>
</head>
<body>
<div class="wrap">

  <div class="topbar">
    <nav class="pagenav">
      <a href="index.html" class="navitem" data-file="index.html" data-i18n="nav.home">Calcolatore</a>
      <a href="metodologia.html" class="navitem" data-file="metodologia.html" data-i18n="nav.method">Metodologia</a>
      <a href="lazy-portfolio.html" class="navitem" data-file="lazy-portfolio.html" data-i18n="nav.lazy">Lazy Portfolio</a>
      <a href="blog.html" class="navitem" data-file="blog.html" data-i18n="nav.blog">Blog</a>
      <a href="bibliografia.html" class="navitem" data-file="bibliografia.html" data-i18n="nav.biblio">Bibliografia</a>
      <a href="disclaimer.html" class="navitem" data-file="disclaimer.html" data-i18n="nav.disclaimer">Disclaimer</a>
    </nav>
    <div class="topbar-right">
      <a class="donate-btn" href="https://www.paypal.com/donate?business=spawnguz%40gmail.com&currency_code=EUR" target="_blank" rel="noopener" data-i18n="nav.donate">☕ Sostieni il progetto</a>
      <div class="themetoggle">
        <button id="theme-dark" title="Tema scuro">🌙</button>
        <button id="theme-light" title="Tema chiaro">☀️</button>
      </div>
      <div class="langtoggle">
        <button id="lang-it" class="active">IT</button>
        <button id="lang-en">EN</button>
      </div>
    </div>
  </div>

  <header>
    <div class="kicker" data-i18n="kicker">Blog</div>
    <h1 data-i18n="title">Note, aggiornamenti e approfondimenti</h1>
    <p data-i18n="subtitle">Scritti dell'autore su allocazione, cicli macro e sull'evoluzione di AUREA.</p>
  </header>

  <div id="posts"></div>

  <footer data-i18n="footer">Gli articoli qui non costituiscono consulenza finanziaria — vedi il Disclaimer.</footer>

</div>

<script src="blog-posts.js"></script>
<script>
let LANG = 'it';
let THEME = 'dark';
const TR = {
  it: {
    "nav.home": "Calcolatore", "nav.method": "Metodologia", "nav.lazy": "Lazy Portfolio", "nav.blog": "Blog", "nav.biblio": "Bibliografia", "nav.disclaimer": "Disclaimer",
    "nav.donate": "\u2615 Sostieni il progetto",
    "kicker": "Blog",
    "title": "Note, aggiornamenti e approfondimenti",
    "subtitle": "Scritti dell'autore su allocazione, cicli macro e sull'evoluzione di AUREA.",
    "empty": "Nessun articolo pubblicato ancora. Torna a trovarci.",
    "footer": "Gli articoli qui non costituiscono consulenza finanziaria — vedi il Disclaimer.",
  },
  en: {
    "nav.home": "Calculator", "nav.method": "Methodology", "nav.lazy": "Lazy Portfolio", "nav.blog": "Blog", "nav.biblio": "Bibliography", "nav.disclaimer": "Disclaimer",
    "nav.donate": "\u2615 Support this project",
    "kicker": "Blog",
    "title": "Notes, updates, and deep dives",
    "subtitle": "Writing from the author on allocation, macro cycles, and how AUREA evolves.",
    "empty": "No posts published yet. Check back soon.",
    "footer": "Nothing here constitutes financial advice — see the Disclaimer.",
  }
};

function renderPosts(){
  const container = document.getElementById('posts');
  const posts = (typeof BLOG_POSTS !== 'undefined' ? BLOG_POSTS : []).slice().sort((a,b) => (a.date < b.date ? 1 : -1));
  if (posts.length === 0){
    container.innerHTML = '<div class="empty">' + TR[LANG]['empty'] + '</div>';
    return;
  }
  container.innerHTML = posts.map(p => {
    const title = LANG==='it' ? (p.title_it || p.title_en || '') : (p.title_en || p.title_it || '');
    const body = LANG==='it' ? (p.body_it || p.body_en || '') : (p.body_en || p.body_it || '');
    const paras = body.split(/\n\s*\n/).map(par => '<p>' + par.replace(/\n/g,'<br>') + '</p>').join('');
    return `<article class="post"><div class="date">${p.date || ''}</div><h2>${title}</h2><div class="body">${paras}</div></article>`;
  }).join('');
}

function updateNav(){
  const current = (window.location.pathname.split('/').pop() || 'index.html');
  document.querySelectorAll('.navitem').forEach(a => {
    const base = a.getAttribute('data-file');
    a.href = base + '?lang=' + LANG + '&theme=' + THEME;
    a.classList.toggle('active', base === current);
  });
}

function applyStaticTranslations(){
  updateNav();
  document.querySelectorAll('[data-i18n]').forEach(el => {
    const key = el.getAttribute('data-i18n');
    const val = TR[LANG][key];
    if (typeof val === 'string') el.innerHTML = val;
  });
  document.getElementById('html-root').lang = LANG;
  document.getElementById('lang-it').classList.toggle('active', LANG==='it');
  document.getElementById('lang-en').classList.toggle('active', LANG==='en');
  renderPosts();
}

function setLang(lang){ LANG = lang; applyStaticTranslations(); }
document.getElementById('lang-it').addEventListener('click', () => setLang('it'));
document.getElementById('lang-en').addEventListener('click', () => setLang('en'));

function applyTheme(){
  document.getElementById('html-root').setAttribute('data-theme', THEME);
  document.getElementById('theme-dark').classList.toggle('active', THEME==='dark');
  document.getElementById('theme-light').classList.toggle('active', THEME==='light');
  updateNav();
}
function setTheme(t){ THEME = t; applyTheme(); }
document.getElementById('theme-dark').addEventListener('click', () => setTheme('dark'));
document.getElementById('theme-light').addEventListener('click', () => setTheme('light'));

(function init(){
  const params = new URLSearchParams(window.location.search);
  const initLang = params.get('lang');
  if (initLang === 'en' || initLang === 'it') LANG = initLang;
  const initTheme = params.get('theme');
  if (initTheme === 'light' || initTheme === 'dark') THEME = initTheme;
  applyTheme();
  applyStaticTranslations();
})();
</script>
</body>
</html>
